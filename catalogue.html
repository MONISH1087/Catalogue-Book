<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book Catalogue</title>
  <link rel="stylesheet" type="text/css" href="index.css">
</head>
<body>
  <h1>Book Catalogue</h1>
  <table>
    <tr>
      <th>Cover</th>
      <th>Author</th>
      <th>Publisher</th>
      <th>Price</th>
      <th>Action</th>
    </tr>
    <tr>
      <td><img src="Atomic Habits.jpg" alt="Book Cover 1"></td>
      <td>James Clear</td>
      <td>Atomic Habits</td>
      <td class="price">Rs.250</td>
      <td><button class="btn">Add to Cart</button></td>
    </tr>
    <tr>
      <td><img src="Rich Dad Poor Dad.jpg" alt="Book Cover 2"></td>
      <td>Robert T. Kiyosaki</td>
      <td>Rich Dad Poor Dad</td>
      <td class="price">Rs.300</td>
      <td><button class="btn">Add to Cart</button></td>
    </tr>
    <tr>
      <td><img src="Zero to One.jpg" alt="Book Cover 3"></td>
      <td>Peter Thiel</td>
      <td>Zero to One</td>
      <td class="price">Rs.180</td>
      <td><button class="btn">Add to Cart</button></td>
    </tr>
    <tr>
      <td><img src="Psychology of Money.jpg" alt="Book Cover 4"></td>
      <td>Morgan Housel</td>
      <td>The Psychology of Money</td>
      <td class="price">Rs.180</td>
      <td><button class="btn">Add to Cart</button></td>
    </tr>
    <tr>
      <td><img src="Mindset.jpg" alt="Book Cover 5"></td>
      <td>Carol Dweck</td>
      <td>Mindset</td>
      <td class="price">Rs.280</td>
      <td><button class="btn">Add to Cart</button></td>
    </tr>
  </table>
</body>
</html>
